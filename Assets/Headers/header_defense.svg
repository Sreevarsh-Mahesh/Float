<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#112845"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(13,71,161,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(13,71,161,0.05)"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes wave1 { 0%,100%{d:path('M0,74 C90,60 190,84 290,70 C390,56 490,80 590,68 C690,56 745,74 800,70 L800,100 L0,100 Z')} 50%{d:path('M0,70 C90,80 190,60 290,74 C390,64 490,56 590,72 C690,78 745,62 800,74 L800,100 L0,100 Z')} }
    @keyframes wave2 { 0%,100%{d:path('M0,79 C130,69 230,89 390,74 C530,59 630,84 800,77 L800,100 L0,100 Z')} 50%{d:path('M0,84 C130,77 230,64 390,79 C530,89 630,69 800,81 L800,100 L0,100 Z')} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    @keyframes sparkle { 0%,100%{opacity:0.2} 50%{opacity:0.8} }
    .w1{animation:wave1 4.4s ease-in-out infinite}
    .w2{animation:wave2 5.6s ease-in-out infinite}
    .title{animation:float 3.5s ease-in-out infinite}
    .spark{animation:sparkle 2.4s ease-in-out infinite}
  </style>
  <rect width="800" height="100" fill="url(#bg)" rx="10"/>
  <circle cx="58" cy="24" r="2.5" fill="rgba(255,255,255,0.16)" class="spark"/>
  <circle cx="742" cy="20" r="1.8" fill="rgba(255,255,255,0.12)" class="spark" style="animation-delay:0.7s"/>
  <circle cx="675" cy="40" r="1.5" fill="rgba(255,255,255,0.1)" class="spark" style="animation-delay:1.2s"/>
  <path class="w2" fill="url(#wave2)" d="M0,79 C130,69 230,89 390,74 C530,59 630,84 800,77 L800,100 L0,100 Z"/>
  <path class="w1" fill="url(#wave1)" d="M0,74 C90,60 190,84 290,70 C390,56 490,80 590,68 C690,56 745,74 800,70 L800,100 L0,100 Z"/>
  <g class="title">
    <text x="400" y="48" fill="white" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="0.5">Adversarial Defense &amp; Anti-Spoofing</text>
  </g>
</svg>
