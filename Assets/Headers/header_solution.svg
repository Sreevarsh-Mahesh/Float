<svg xmlns="http://www.w3.org/2000/svg" width="800" height="100" viewBox="0 0 800 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#103050"/>
      <stop offset="100%" style="stop-color:#1e88e5"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(30,136,229,0.25)"/>
      <stop offset="100%" style="stop-color:rgba(30,136,229,0.05)"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes wave1 { 0%,100%{d:path('M0,72 C90,58 190,82 290,68 C390,54 490,78 590,66 C690,54 745,72 800,68 L800,100 L0,100 Z')} 50%{d:path('M0,68 C90,78 190,58 290,72 C390,62 490,54 590,70 C690,76 745,60 800,72 L800,100 L0,100 Z')} }
    @keyframes wave2 { 0%,100%{d:path('M0,78 C130,68 230,88 390,73 C530,58 630,83 800,76 L800,100 L0,100 Z')} 50%{d:path('M0,83 C130,76 230,63 390,78 C530,88 630,68 800,80 L800,100 L0,100 Z')} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
    @keyframes sparkle { 0%,100%{opacity:0.2} 50%{opacity:0.8} }
    .w1{animation:wave1 4s ease-in-out infinite}
    .w2{animation:wave2 5s ease-in-out infinite}
    .title{animation:float 3.2s ease-in-out infinite}
    .spark{animation:sparkle 2s ease-in-out infinite}
  </style>
  <rect width="800" height="100" fill="url(#bg)" rx="10"/>
  <circle cx="70" cy="25" r="2.2" fill="rgba(255,255,255,0.16)" class="spark"/>
  <circle cx="730" cy="20" r="2" fill="rgba(255,255,255,0.12)" class="spark" style="animation-delay:0.6s"/>
  <circle cx="680" cy="42" r="1.5" fill="rgba(255,255,255,0.1)" class="spark" style="animation-delay:1.1s"/>
  <path class="w2" fill="url(#wave2)" d="M0,78 C130,68 230,88 390,73 C530,58 630,83 800,76 L800,100 L0,100 Z"/>
  <path class="w1" fill="url(#wave1)" d="M0,72 C90,58 190,82 290,68 C390,54 490,78 590,66 C690,54 745,72 800,68 L800,100 L0,100 Z"/>
  <g class="title">
    <text x="400" y="48" fill="white" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="0.5">How We Solve It</text>
  </g>
</svg>
